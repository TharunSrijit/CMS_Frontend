<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Enter Lab Result</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>

<body>

<div class="app-wrapper">

    <aside class="sidebar" id="menu">

        <a href="dashboard.html" class="sidebar-brand">

            <div class="sidebar-brand-icon">
                ⚕
            </div>

            <div class="sidebar-brand-text">

                <span class="sidebar-brand-name">
                    Clinic Management
                </span>

                <span class="sidebar-brand-sub">
                    Laboratory
                </span>

            </div>

        </a>


        <nav class="sidebar-nav">

            <div class="nav-section-label">
                Laboratory
            </div>

            <a href="dashboard.html" class="nav-item">
                <span class="nav-item-icon">⌂</span>
                <span class="nav-item-label">Dashboard</span>
            </a>

            <a href="pending-lab-orders.html" class="nav-item active">
                <span class="nav-item-icon">◷</span>
                <span class="nav-item-label">Pending Orders</span>
            </a>

            <a href="completed-tests.html" class="nav-item">
                <span class="nav-item-icon">✓</span>
                <span class="nav-item-label">Completed Tests</span>
            </a>

            <a href="lab-billing.html" class="nav-item">
                <span class="nav-item-icon">₹</span>
                <span class="nav-item-label">Lab Billing</span>
            </a>

        </nav>

    </aside>


    <div class="main-content">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="topbar-toggle"
                    type="button"
                    onclick="toggleSidebar()">

                    ☰

                </button>

                <div>

                    <div class="topbar-page-title">
                        Enter Result
                    </div>

                    <div class="topbar-breadcrumb">
                        <span>Laboratory</span>
                        <span class="topbar-breadcrumb-sep">/</span>
                        <span>Enter Result</span>
                    </div>

                </div>

            </div>

        </header>


        <main class="page-content">

            <div class="page-header">

                <div class="page-header-left">

                    <h1 class="page-title">
                        Enter Laboratory Result
                    </h1>

                    <p class="page-subtitle">
                        Enter and save the result for this test.
                    </p>

                </div>

            </div>


            <form onsubmit="saveLabResult(event)">

                <div class="form-section">

                    <div class="form-section-header">

                        <div>

                            <div class="form-section-title">
                                Test Information
                            </div>

                            <div class="form-section-subtitle">
                                Selected test
                            </div>

                        </div>

                    </div>


                    <div class="form-section-body">

                        <div class="form-grid form-grid-2">

                            <div class="form-group">
                                <label class="form-label" for="orderId">Order / Test ID</label>
                                <input type="text" id="orderId" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="patientName">Patient Name</label>
                                <input type="text" id="patientName" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="patientId">Patient ID</label>
                                <input type="text" id="patientId" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="doctorName">Doctor</label>
                                <input type="text" id="doctorName" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="testName">Test Name</label>
                                <input type="text" id="testName" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="testId">Master Test ID</label>
                                <input type="text" id="testId" class="form-control" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="normalRange">Normal Range (From Master)</label>
                                <input type="text" id="normalRange" class="form-control" readonly style="font-weight:600; color:var(--text-primary);">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="testUnit">Unit</label>
                                <input type="text" id="testUnit" class="form-control" readonly>
                            </div>

                        </div>

                    </div>

                </div>


                <div class="form-section">

                    <div class="form-section-header">

                        <div>

                            <div class="form-section-title">
                                Result Entry
                            </div>

                            <div class="form-section-subtitle">
                                Enter measured test value
                            </div>

                        </div>

                    </div>


                    <div class="form-section-body">

                        <div class="form-group">

                            <label
                                class="form-label"
                                for="testResult">

                                Test Result
                                <span class="required">*</span>

                            </label>

                            <input
                                type="text"
                                id="testResult"
                                class="form-control form-control-lg"
                                placeholder="Enter result value (e.g. 92)"
                                required
                                autofocus>

                        </div>


                        <div class="form-group mt-20">

                            <label
                                class="form-label"
                                for="remarks">

                                Remarks <span style="font-weight:400; font-size:12px; color:var(--text-muted);">(Optional)</span>

                            </label>

                            <textarea
                                id="remarks"
                                class="form-control"
                                rows="3"
                                placeholder="Enter optional clinical remarks or notes if needed"></textarea>

                        </div>

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="pending-lab-orders.html"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Result

                    </button>

                </div>

            </form>


            <div
                id="resultMessage"
                class="mt-20">
            </div>

        </main>

    </div>

</div>


<script>

function toggleSidebar() {

    const sidebar =
        document.getElementById("menu");

    if (sidebar) {
        sidebar.classList.toggle("open");
    }

}

</script>

<script src="../js/lab.js"></script>

</body>
</html>
