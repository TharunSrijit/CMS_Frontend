<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lab Test Details</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>

<body>

<div class="app-wrapper">

    <aside class="sidebar" id="menu">

        <a href="dashboard.html" class="sidebar-brand">

            <div class="sidebar-brand-icon">
                ⚕
            </div>

            <div class="sidebar-brand-text">

                <span class="sidebar-brand-name">
                    Clinic Management
                </span>

                <span class="sidebar-brand-sub">
                    Laboratory
                </span>

            </div>

        </a>


        <nav class="sidebar-nav">

            <div class="nav-section-label">
                Laboratory
            </div>

            <a href="dashboard.html" class="nav-item">
                <span class="nav-item-icon">⌂</span>
                <span class="nav-item-label">Dashboard</span>
            </a>

            <a href="enter-new-test.html" class="nav-item">
                <span class="nav-item-icon">＋</span>
                <span class="nav-item-label">Enter New Test</span>
            </a>

            <a href="pending-lab-orders.html" class="nav-item active">
                <span class="nav-item-icon">◷</span>
                <span class="nav-item-label">Pending Orders</span>
            </a>

            <a href="completed-tests.html" class="nav-item">
                <span class="nav-item-icon">✓</span>
                <span class="nav-item-label">Completed Tests</span>
            </a>

            <a href="lab-billing.html" class="nav-item">
                <span class="nav-item-icon">₹</span>
                <span class="nav-item-label">Lab Billing</span>
            </a>

        </nav>

    </aside>


    <div class="main-content">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="topbar-toggle"
                    type="button"
                    onclick="toggleSidebar()">

                    ☰

                </button>

                <div>

                    <div class="topbar-page-title">
                        Test Details
                    </div>

                    <div class="topbar-breadcrumb">
                        <span>Laboratory</span>
                        <span class="topbar-breadcrumb-sep">/</span>
                        <span>Test Details</span>
                    </div>

                </div>

            </div>

        </header>


        <main class="page-content">

            <div class="page-header">

                <div class="page-header-left">

                    <h1 class="page-title">
                        Laboratory Test Details
                    </h1>

                    <p class="page-subtitle">
                        Review the selected laboratory order.
                    </p>

                </div>

            </div>


            <div class="form-section">

                <div class="form-section-header">

                    <div>

                        <div class="form-section-title">
                            Test Information
                        </div>

                        <div class="form-section-subtitle">
                            Laboratory order details
                        </div>

                    </div>

                </div>


                <div class="form-section-body">

                    <div class="form-grid form-grid-2">

                        <div class="form-group">

                            <label class="form-label">
                                Test ID
                            </label>

                            <input
                                type="text"
                                id="orderId"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Patient Name
                            </label>

                            <input
                                type="text"
                                id="patientName"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Patient ID
                            </label>

                            <input
                                type="text"
                                id="patientId"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Doctor
                            </label>

                            <input
                                type="text"
                                id="doctorName"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Laboratory Test
                            </label>

                            <input
                                type="text"
                                id="testName"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Test Date
                            </label>

                            <input
                                type="text"
                                id="testDate"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Priority
                            </label>

                            <input
                                type="text"
                                id="testPriority"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Status
                            </label>

                            <input
                                type="text"
                                id="testStatus"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="form-group col-span-2">

                            <label class="form-label">
                                Notes
                            </label>

                            <textarea
                                id="testNotes"
                                class="form-control"
                                rows="5"
                                readonly></textarea>

                        </div>

                    </div>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="pending-lab-orders.html"
                    class="btn btn-secondary">

                    Back

                </a>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="goToResults()">

                    Enter Result

                </button>

            </div>

        </main>

    </div>

</div>


<script>

function toggleSidebar() {

    const sidebar =
        document.getElementById("menu");

    if (sidebar) {
        sidebar.classList.toggle("open");
    }

}

</script>

<script src="../js/lab.js"></script>

</body>
</html>
