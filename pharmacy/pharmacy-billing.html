<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Billing</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <h1>Pharmacy Management System</h1>
    <p>Pharmacy Billing</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="prescription-queue.html">Prescription Queue</a>
    <a href="prescription-details.html">Prescription Details</a>
    <a href="dispense-medicine.html">Dispense Medicine</a>
    <a href="medicine-inventory.html">Medicine Inventory</a>
    <a href="stock.html">Stock</a>
    <a href="pharmacy-billing.html">Billing</a>
</nav>

<main>

    <h2>Pharmacy Billing</h2>

    <div class="box">

        <label>Patient Name</label>

        <input type="text"
               id="patientName"
               placeholder="Enter patient name">

        <br><br>

        <label>Medicine</label>

        <select id="billMedicine"
                onchange="calculateBill()">

            <option value="">Select Medicine</option>
            <option value="20">Paracetamol - ₹20</option>
            <option value="80">Amoxicillin - ₹80</option>
            <option value="30">Cetirizine - ₹30</option>
            <option value="60">Azithromycin - ₹60</option>

        </select>

        <br><br>

        <label>Quantity</label>

        <input type="number"
               id="billQuantity"
               value="1"
               min="1"
               oninput="calculateBill()">

        <h3>
            Total: ₹<span id="total">0</span>
        </h3>

        <button onclick="generateBill()">
            Generate Bill
        </button>

        <p id="billMessage"></p>

    </div>

</main>

<script src="pharmacy.js"></script>

</body>
</html>
