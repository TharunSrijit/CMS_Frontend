<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>User Management - CMS</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
```

</head>

<body>

```
<!-- Header -->
<header>

    <h1>Clinic Management System</h1>

    <p>User Management</p>

    <a href="dashboard.html">
        Back to Dashboard
    </a>

</header>


<main>

    <!-- Add User -->
    <section>

        <h2>Add User</h2>


        <form id="userForm"
              onsubmit="event.preventDefault(); addUser();">


            <label for="userName">
                User Name
            </label>

            <input
                type="text"
                id="userName"
                placeholder="Enter user name"
                required
            >


            <label for="userEmail">
                Email
            </label>

            <input
                type="email"
                id="userEmail"
                placeholder="Enter email"
                required
            >


            <label for="userRole">
                Role
            </label>

            <select id="userRole" required>

                <option value="">
                    Select Role
                </option>

                <option value="Admin">
                    Admin
                </option>

                <option value="Doctor">
                    Doctor
                </option>

                <option value="Receptionist">
                    Receptionist
                </option>

                <option value="Lab Technician">
                    Lab Technician
                </option>

                <option value="Pharmacist">
                    Pharmacist
                </option>

            </select>


            <button type="submit">
                Add User
            </button>

        </form>

    </section>


    <!-- User List -->
    <section>

        <h2>User List</h2>


        <!-- Search -->
        <input
            type="text"
            id="userSearch"
            placeholder="Search by name, email or role"
            oninput="searchUsers()"
        >


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Role</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="userTableBody">

            </tbody>

        </table>

    </section>

</main>


<script src="../js/storage.js"></script>
<script src="../js/admin.js"></script>
```

</body>

</html>
